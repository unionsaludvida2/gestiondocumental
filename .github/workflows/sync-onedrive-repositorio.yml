name: Sincronización Automática OneDrive a Biblioteca

on:
  schedule:
    # Ejecutar cada 30 minutos automáticamente
    - cron: '*/30 * * * *'
  workflow_dispatch: # Disparo manual en 1 clic desde la pestaña Actions en GitHub
  push:
    paths:
      - '.github/workflows/sync-onedrive-repositorio.yml'

permissions:
  contents: read

jobs:
  sincronizar-vinculos:
    name: Comparar Vínculos de OneDrive y Actualizar Biblioteca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Comparación y Sincronización Cloud
        run: |
          python - << 'EOF'
          import urllib.request
          import http.cookiejar
          import csv
          import io
          import json
          import sys

          ONEDRIVE_CSV_URL = (
              "https://unionsaludvida-my.sharepoint.com/:x:/p/plantillas/"
              "IQCctVunBodCQq97XWMPrue7AaIRpd-pVgSUuZrMBWBcA2A?e=revQbX&download=1"
          )
          GOOGLE_SHEETS_CSV_URL = (
              "https://docs.google.com/spreadsheets/d/"
              "1ecwTurb2IyuO9qs4_PkAsQrULENh3J-RXEWbl5Ihhug/export?format=csv"
          )
          GOOGLE_SCRIPT_CONF_URL = (
              "https://script.google.com/macros/s/"
              "AKfycbx4-82Ls3Zu5gdzXlAhezZ6ew9tnAece8xSDMQ8QmXcu7UCnMxwqB48ISG_LwNDUgMiQQ/exec"
          )

          print("=================================================================")
          print("  Sincronizador Automático de Vínculos OneDrive -> Biblioteca")
          print("=================================================================")

          # 1. Descargar catálogo de OneDrive
          print("1. Descargando REPOSITORIO_DOCUMENTAL desde OneDrive...")
          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          opener.addheaders = [('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)')]
          
          try:
              with opener.open(ONEDRIVE_CSV_URL, timeout=30) as resp:
                  raw_bytes = resp.read()
          except Exception as e_od:
              print(f"❌ Error descargando OneDrive CSV: {e_od}")
              sys.exit(1)

          if len(raw_bytes) < 100:
              print("❌ Archivo de OneDrive vacío o insuficiente.")
              sys.exit(1)

          try:
              csv_od = raw_bytes.decode('windows-1252')
          except Exception:
              csv_od = raw_bytes.decode('utf-8-sig', errors='replace')

          reader_od = list(csv.reader(io.StringIO(csv_od), delimiter=';'))
          od_map = {}
          for r in reader_od[1:]:
              if len(r) >= 8 and r[0].strip():
                  cod = r[0].strip().upper()
                  link = r[7].strip() or r[6].strip()
                  if link and link.startswith('http'):
                      od_map[cod] = link

          print(f"   ✅ Se identificaron {len(od_map)} códigos en OneDrive con vínculo directo.")

          # 2. Descargar catálogo actual de Biblioteca_Pruebas
          print("2. Consultando inventario activo en Google Sheets (Biblioteca_Pruebas)...")
          try:
              req_bp = urllib.request.Request(GOOGLE_SHEETS_CSV_URL, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req_bp, timeout=30) as resp_bp:
                  csv_bp = resp_bp.read().decode('utf-8', errors='replace')
          except Exception as e_bp:
              print(f"❌ Error descargando Biblioteca_Pruebas: {e_bp}")
              sys.exit(1)

          reader_bp = list(csv.reader(io.StringIO(csv_bp)))
          bp_rows = reader_bp[1:] if len(reader_bp) > 1 else []
          print(f"   ✅ Se cargaron {len(bp_rows)} documentos desde Google Sheets.")

          # 3. Detectar diferencias en los vínculos
          cambios = []
          for r in bp_rows:
              if len(r) > 4 and r[4].strip():
                  cod = r[4].strip().upper()
                  current_dir = r[23].strip() if len(r) > 23 else ''
                  od_link = od_map.get(cod)

                  # Si OneDrive tiene un link y es diferente al registrado en la biblioteca
                  if od_link and od_link != current_dir:
                      cambios.append({
                          'codigo': cod,
                          'vinculoDirecto': od_link,
                          'usuario': 'Sincronizador Automático OneDrive',
                          'detalle': 'Actualización automática de vínculo por cruce con REPOSITORIO_DOCUMENTAL'
                      })

          print(f"3. Comparación completada: {len(cambios)} documentos requieren actualización de vínculo.")

          # 4. Si hay cambios, enviar actualización a Google Apps Script
          if not cambios:
              print("✅ Todos los vínculos de Biblioteca_Pruebas coinciden con OneDrive. Sin cambios pendientes.")
              sys.exit(0)

          print(f"4. Enviando {len(cambios)} actualizaciones a Google Apps Script...")
          payload = {
              "accion": "actualizar_vinculos_lote",
              "cambios": cambios
          }
          json_data = json.dumps(payload, ensure_ascii=False).encode('utf-8')

          req_gas = urllib.request.Request(
              GOOGLE_SCRIPT_CONF_URL,
              data=json_data,
              headers={'Content-Type': 'application/json; charset=utf-8', 'User-Agent': 'Mozilla/5.0'}
          )

          try:
              with urllib.request.urlopen(req_gas, timeout=60) as resp_gas:
                  gas_result = resp_gas.read().decode('utf-8')
              print(f"   Respuesta de Google Apps Script: {gas_result}")
              print(f"✅ Se actualizaron exitosamente {len(cambios)} vínculos en Biblioteca_Pruebas y se reportaron en Historico_Documentos.")
          except Exception as e_gas:
              print(f"❌ Error comunicando con Google Apps Script: {e_gas}")
              sys.exit(1)
          EOF
